<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="250" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes pacman-move {
        0% { transform: translateX(0px); }
        100% { transform: translateX(800px); }
      }
      @keyframes mouth {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-20deg); }
      }
      .pacman-body { animation: pacman-move 6s infinite linear; }
      .mouth { animation: mouth 0.4s infinite; }
    </style>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="250" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#39FF14" font-size="28" font-weight="bold" font-family="monospace">
    🎮 PAC-MAN EATING YOUR CONTRIBUTIONS 🎮
  </text>
  
  <!-- Contribution Squares -->
  <g id="squares">
    <rect x="100" y="100" width="15" height="15" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="120" y="100" width="15" height="15" fill="#0E4429" stroke="#30363D" stroke-width="1"/>
    <rect x="140" y="100" width="15" height="15" fill="#006D32" stroke="#30363D" stroke-width="1"/>
    <rect x="160" y="100" width="15" height="15" fill="#26A641" stroke="#30363D" stroke-width="1"/>
    <rect x="180" y="100" width="15" height="15" fill="#39FF14" stroke="#30363D" stroke-width="1"/>
    
    <rect x="100" y="120" width="15" height="15" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="120" y="120" width="15" height="15" fill="#0E4429" stroke="#30363D" stroke-width="1"/>
    <rect x="140" y="120" width="15" height="15" fill="#006D32" stroke="#30363D" stroke-width="1"/>
    <rect x="160" y="120" width="15" height="15" fill="#26A641" stroke="#30363D" stroke-width="1"/>
    <rect x="180" y="120" width="15" height="15" fill="#39FF14" stroke="#30363D" stroke-width="1"/>
    
    <rect x="100" y="140" width="15" height="15" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <rect x="120" y="140" width="15" height="15" fill="#0E4429" stroke="#30363D" stroke-width="1"/>
    <rect x="140" y="140" width="15" height="15" fill="#006D32" stroke="#30363D" stroke-width="1"/>
    <rect x="160" y="140" width="15" height="15" fill="#26A641" stroke="#30363D" stroke-width="1"/>
    <rect x="180" y="140" width="15" height="15" fill="#39FF14" stroke="#30363D" stroke-width="1"/>
  </g>
  
  <!-- Pac-Man -->
  <g class="pacman-body">
    <circle cx="70" cy="120" r="20" fill="url(#glow)"/>
    <path class="mouth" d="M 85 115 Q 95 120 85 125 Z" fill="#0d1117" transform-origin="85 120"/>
    <circle cx="88" cy="117" r="3" fill="#0d1117"/>
  </g>
  
  <!-- Pellets -->
  <circle cx="200" cy="105" r="3" fill="#39FF14" opacity="0.8"/>
  <circle cx="200" cy="120" r="3" fill="#39FF14" opacity="0.8"/>
  <circle cx="200" cy="135" r="3" fill="#39FF14" opacity="0.8"/>
  <circle cx="220" cy="105" r="3" fill="#39FF14" opacity="0.8"/>
  <circle cx="220" cy="135" r="3" fill="#39FF14" opacity="0.8"/>
  
  <!-- Status Text -->
  <text x="450" y="210" text-anchor="middle" fill="#39FF14" font-size="14" font-family="monospace">
    nom nom nom...🍽️
  </text>
  <text x="450" y="230" text-anchor="middle" fill="#666" font-size="11" font-family="monospace">
    Contributions being eaten since 2023
  </text>
</svg>
